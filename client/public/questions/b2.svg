<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1E1220" />
      <stop offset="100%" stop-color="#08080E" />
    </radialGradient>
    <linearGradient id="tierGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#E50914" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGlow)" />
  <rect width="1200" height="675" fill="none" stroke="#222232" stroke-width="4" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
  </g>

  <!-- Top Badges -->
  <g transform="translate(60, 50)">
    <rect width="240" height="42" rx="10" fill="#141420" stroke="#F59E0B" stroke-width="2" />
    <text x="120" y="27" fill="#F59E0B" font-family="system-ui, sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="1.5">BLAZE TIER • 10 PTS</text>

    <rect x="255" width="160" height="42" rx="10" fill="#181824" stroke="#333346" stroke-width="1.5" />
    <text x="335" y="27" fill="#A1A1AA" font-family="monospace" font-weight="700" font-size="13" text-anchor="middle" letter-spacing="1">LOGIC PUZZLE</text>

    <rect x="940" width="140" height="42" rx="10" fill="#E50914" opacity="0.9" />
    <text x="1010" y="27" fill="#FFFFFF" font-family="monospace" font-weight="900" font-size="16" text-anchor="middle" letter-spacing="2">#B2</text>
  </g>

  <!-- Central Card Content -->
  <g transform="translate(60, 125)">
    <!-- Inner Card -->
    <rect width="1080" height="490" rx="24" fill="#0C0C14" stroke="#F59E0B" stroke-width="2.5" opacity="0.95" />
    <rect width="1080" height="490" rx="24" fill="none" stroke="#F59E0B" stroke-width="6" opacity="0.15" filter="url(#neon)" />

    <!-- Big Headline -->
    <text x="60" y="80" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5">
      Floating Point Precision Betrayal
    </text>

    <!-- Subtitle / Humor Hint -->
    <text x="60" y="125" fill="#E50914" font-family="system-ui, sans-serif" font-weight="700" font-size="20" letter-spacing="0.5">
      💡 SCENARIO: Why simple arithmetic fails in Python &amp; JS
    </text>

    <!-- Code / Terminal / Riddle Box -->
    <g transform="translate(60, 160)">
      <rect width="960" height="260" rx="16" fill="#05050A" stroke="#252536" stroke-width="2" />
      
      <!-- Terminal dots -->
      <circle cx="30" cy="25" r="7" fill="#EF4444" />
      <circle cx="52" cy="25" r="7" fill="#F59E0B" />
      <circle cx="74" cy="25" r="7" fill="#10B981" />
      <text x="105" y="30" fill="#71717A" font-family="monospace" font-size="13">challenge_terminal.sh — bash 80x24</text>
      <line x1="0" y1="50" x2="960" y2="50" stroke="#1A1A28" stroke-width="1.5" />

      <!-- Terminal content lines -->
      <text x="35" y="95" fill="#38BDF8" font-family="monospace" font-weight="700" font-size="22">0.1 + 0.2 === 0.3; // ▶ FALSE!</text>
      <text x="35" y="140" fill="#F43F5E" font-family="monospace" font-weight="700" font-size="22">console.log(0.1 + 0.2);</text>
      <text x="35" y="185" fill="#4ADE80" font-family="monospace" font-weight="700" font-size="22">// Outputs: 0.30000000000000004</text>
      <text x="35" y="230" fill="#FACC15" font-family="monospace" font-weight="700" font-size="20">▶ What IEEE standard causes this binary fraction leak?</text>
    </g>
  </g>
</svg>